name: Update and Merge IPTV

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch, Process, Group and Clean IPTV
        run: |
          mkdir -p out
          
          cat << 'EOF' > process_iptv.py
          import urllib.request
          import re

          urls = [
              "https://raw.githubusercontent.com/CCSH/IPTV/main/live.m3u",
              "https://raw.githubusercontent.com/skddyj/iptv/main/IPTV.m3u",
              "https://iptv.su7.cn.mt/iptv?key=bugaosunihaha",
              "https://iptv.ybs.ccwu.cc/interface.m3u",
              "https://iptv.yu7.qzz.io/iptv.m3u?key=aqsjlyf",
              "https://iptv.rsm.us.ci/xymm",
              "https://iptv.yu7.cc.cd/iptv",
              "https://zuboiptv.myyu7.ccwu.cc/iptv",
              "https://zhuan.myyu7.ccwu.cc/iptv",
              "https://zhongjiiptv.yu7.cc.cd/live"
          ]

          def get_group(name):
              name_upper = name.upper()
              if re.search(r'CCTV|中央', name_upper): return "央视频道"
              if "卫视" in name: return "卫视频道"
              if "CGTN" in name_upper: return "CGTN"
              if re.search(r'凤凰|翡翠|TVB|HBO|星空|明珠|动感|FOX|CNN|BBC|澳亚|莲花|三立|中天|东森', name): return "港澳台/外视"
              if re.search(r'电影|影院|剧场|影视|动作|喜剧|科幻', name): return "影视频道"
              if re.search(r'体育|足球|篮球|CBA|NBA|赛事|竞技|赛车', name): return "体育频道"
              if re.search(r'少儿|动画|卡通|炫动|动漫', name): return "少儿动画"
              if re.search(r'新闻|资讯', name): return "新闻频道"
              if re.search(r'纪实|纪录|探索|地理|人文|历史', name): return "纪实历史"
              if re.search(r'音乐|MTV|演唱会', name): return "音乐频道"
              return "其他频道"

          def get_logo(name):
              return f"https://raw.githubusercontent.com/Fanmingming/live/main/tv/{name}.png" if name else ""

          seen_urls = set()
          channels = []

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      content = response.read().decode('utf-8', errors='ignore')
                      lines = content.splitlines()
                      
                      current_name = ""
                      for line in lines:
                          line = line.strip()
                          if not line:
                              continue
                          
                          # M3U 格式解析
                          if line.startswith("#EXTINF"):
                              if "," in line:
                                  current_name = line.split(",")[-1].strip()
                              else:
                                  current_name = "未知频道"
                          elif line.startswith(("http://", "https://")) and current_name:
                              if line not in seen_urls:
                                  seen_urls.add(line)
                                  group = get_group(current_name)
                                  logo = get_logo(current_name)
                                  channels.append(f'#EXTINF:-1 tvg-name="{current_name}" tvg-logo="{logo}" group-title="{group}",{current_name}\n{line}')
                              current_name = ""
                          
                          # TXT 格式解析 (频道名,http://...)
                          elif "," in line and ("http://" in line or "https://" in line):
                              parts = line.split(",", 1)
                              name = parts[0].strip()
                              stream_url = parts[1].strip()
                              if stream_url.startswith(("http://", "https://")) and stream_url not in seen_urls:
                                  seen_urls.add(stream_url)
                                  group = get_group(name)
                                  logo = get_logo(name)
                                  channels.append(f'#EXTINF:-1 tvg-name="{name}" tvg-logo="{logo}" group-title="{group}",{name}\n{stream_url}')
              except Exception as e:
                  print(f"抓取失败 {url}: {e}")

          if channels:
              with open("out/iptv.m3u8", "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n" + "\n".join(channels) + "\n")
              print(f"成功导出 {len(channels)} 个频道。")
          else:
              print("错误：未能解析到任何有效频道！")
              exit(1)
          EOF

          python3 process_iptv.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f out/iptv.m3u8
          if git diff --staged --quiet; then
            echo "没有任何变更，无需提交。"
          else
            git commit -m "Merged IPTV with EPG & Logos: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
